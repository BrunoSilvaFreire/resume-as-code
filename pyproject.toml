[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "career-kb"
version = "0.1.0"
description = "Local validation and retrieval helpers for a modular career knowledge base"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
render = ["rendercv[full]==2.8"]

[project.scripts]
career = "career_kb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["career_kb"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
